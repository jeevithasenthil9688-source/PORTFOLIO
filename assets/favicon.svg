<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded hexagon / chip container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0b1120" stroke="url(#glowGrad)" stroke-width="2.5" />
  
  <!-- Subtle circuit lines -->
  <path d="M12 20 L22 20 L27 15 L37 15" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="12" cy="20" r="2.5" fill="#00f0ff" />
  
  <path d="M52 44 L42 44 L37 49 L27 49" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4" />
  <circle cx="52" cy="44" r="2.5" fill="#3b82f6" />

  <!-- Monogram JM with electric pulse aesthetic -->
  <text x="32" y="39" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#glowGrad)" filter="url(#circuitGlow)" letter-spacing="1">JM</text>
  
  <!-- Electric node dots -->
  <circle cx="32" cy="53" r="2" fill="#00f0ff" />
  <line x1="32" y1="46" x2="32" y2="53" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>
